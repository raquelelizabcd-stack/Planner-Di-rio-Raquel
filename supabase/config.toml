# Supabase Local Configuration for Planner Diário Raquel
# Schema and migrations configuration for Supabase CLI

project_id = "planner-diario-raquel"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600

[storage]
enabled = true
file_size_limit = "50MiB"
